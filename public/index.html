<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock'd - VisionGate</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- TensorFlow.js + hand pose detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
</head>
<body>
    <div class="app-container">
        <h1>Lock'd</h1>
        <div class="main-content">

            <!-- Video container -->
            <div id="video-wrapper" class="locked">
                <div id="player"></div>

                <!-- Puzzle overlay -->
                <div id="puzzle-overlay">
                    <h2 id="puzzle-prompt">Hold up 3 fingers!</h2>
                    <p>Unlock to watch the video</p>
                </div>
            </div>

            <!-- Camera -->
            <div id="camera-container">
                <!-- Hidden webcam element (styled from vision.js) -->
                <video id="webcam-video" playsinline muted></video>
                <!-- Visible mirrored feed with red keypoints -->
                <canvas id="output-canvas"></canvas>
                <!-- Live debug readout -->
                <p id="finger-count" style="margin:6px 0 0;font-family:sans-serif;">Loading camera…</p>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/gameLogic.js"></script>
    <script src="js/youtubeCtrl.js"></script>
    <script src="js/vision.js"></script>
</body>
</html>
